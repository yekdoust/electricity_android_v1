name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Build
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: electricity-1405-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Package source code
        run: git archive --format=zip --output=electricity-1405-source-v1.7.zip HEAD
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: electricity-1405-source
          path: electricity-1405-source-v1.7.zip
